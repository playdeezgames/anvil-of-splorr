<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
@FETCH@
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1c1c24; color: #c8c8d2; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; }
  /* 16:9 logical surface, scaled to fit with crisp pixels */
  #canvas { width: min(100vw, calc((100vh - 48px) * 16 / 9)); aspect-ratio: 16 / 9; image-rendering: pixelated; background: #000; touch-action: none; }
  label { cursor: pointer; padding: 4px 10px; border: 1px solid #40404c; border-radius: 4px; }
  label:hover, label:focus-within { background: #40404c; }
  input[type=file] { position: absolute; opacity: 0; width: 0; height: 0; }
  #msg { min-height: 1.2em; }
</style>
</head>
<body>
<canvas id="canvas" width="320" height="180"></canvas>
<div><label id="open-label" hidden>Open file...<input type="file" id="open"></label> <span id="msg"></span></div>
<script src="odin.js"></script>
<script>
"use strict";
const STORAGE_PREFIX = "anvil-of-splorr.";
// (The most a file can be is asked of the wasm module: file_capacity(), set by FILE_CAP_MIB at build.)
const fileCapacity = () => memory.exports.file_capacity();

const canvasEl = document.getElementById("canvas");
const g = canvasEl.getContext("2d");
const msgEl = document.getElementById("msg");
const memory = new odin.WasmMemoryInterface();

function say(text) { msgEl.textContent = text; }

const bytesAt = (ptr, len) => new Uint8Array(memory.memory.buffer, ptr, len);

const imports = {
  canvas: {
    canvas_clear(r, gr, b) {
      g.fillStyle = `rgb(${r},${gr},${b})`;
      g.fillRect(0, 0, canvasEl.width, canvasEl.height);
    },
    canvas_fill_rect(x, y, w, h, r, gr, b) {
      g.fillStyle = `rgb(${r},${gr},${b})`;
      g.fillRect(x, y, w, h);
    },
  },
  host: {
    // Text stored per file name (the running tool's file); returns its byte length, or -1 if absent.
    storage_get(keyPtr, keyLen, ptr, cap) {
      try {
        const text = localStorage.getItem(STORAGE_PREFIX + new TextDecoder().decode(bytesAt(keyPtr, keyLen)));
        if (text === null) return -1;
        const bytes = new TextEncoder().encode(text);
        if (bytes.length > cap) return bytes.length; // too big: Odin rejects by length
        bytesAt(ptr, bytes.length).set(bytes);
        return bytes.length;
      } catch (e) { return -1; }
    },
    storage_set(keyPtr, keyLen, ptr, len) {
      const key = STORAGE_PREFIX + new TextDecoder().decode(bytesAt(keyPtr, keyLen));
      const text = new TextDecoder().decode(bytesAt(ptr, len));
      try { localStorage.setItem(key, text); } catch (e) { /* storage unavailable */ }
    },
    download(ptr, len, namePtr, nameLen) {
      const blob = new Blob([bytesAt(ptr, len).slice()], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = new TextDecoder().decode(bytesAt(namePtr, nameLen));
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      say(`Saved: downloaded ${a.download} and stored in this browser.`);
    },
  },
};

document.getElementById("open").addEventListener("change", async (ev) => {
  const file = ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  const data = new Uint8Array(await file.arrayBuffer());
  const exp = memory.exports;
  // game_tags.json is not the tool's own file: it is the list of tags the game needs, kept in browser
  // storage where the world editor reads it (open its TAGS list afterwards).
  if (file.name === "game_tags.json") {
    try {
      localStorage.setItem(STORAGE_PREFIX + "game_tags.json", new TextDecoder().decode(data));
      say("Stored game_tags.json: open the TAGS list to read it.");
    } catch (e) { say("game_tags.json: browser storage is unavailable."); }
    return;
  }
  if (!exp || !exp.file_buffer) { say("Editor is not ready yet."); return; }
  if (data.length > fileCapacity()) { say(`${file.name}: too large (${data.length} bytes, at most ${fileCapacity()}). Rebuild with WEB_FILE_MIB=<more>.`); return; }
  bytesAt(exp.file_buffer(), data.length).set(data);
  say(exp.file_loaded(data.length) ? `Loaded ${file.name}.` : `${file.name}: not a valid file for this tool.`);
});

// input_map.json sits next to the page and can be edited by hand; reload to apply.
async function loadInputMap() {
  const exp = memory.exports;
  let res;
  try { res = await fetch("input_map.json", { cache: "no-store" }); } catch (e) { return; }
  if (!res.ok) return; // no file: built-in defaults
  const data = new Uint8Array(await res.arrayBuffer());
  if (data.length <= 4096) bytesAt(exp.input_map_buffer(), data.length).set(data);
  if (!exp.input_map_loaded(data.length)) {
    const err = new TextDecoder().decode(bytesAt(exp.input_map_error_ptr(), exp.input_map_error_len()));
    say(`input_map.json: ${err} (using default keys)`);
  }
}

// game_tags.json (the tags a game needs) sits next to the page when there is one: keep it in browser
// storage, where the world editor reads it. No file: nothing changes.
async function loadGameTags() {
  let res;
  try { res = await fetch("game_tags.json", { cache: "no-store" }); } catch (e) { return; }
  if (!res.ok) return;
  try { localStorage.setItem(STORAGE_PREFIX + "game_tags.json", await res.text()); } catch (e) { /* storage unavailable */ }
}

// Files the page fetches from beside itself and hands straight to the running tool (as if chosen with
// "Open file"), listed in <meta name="anvil-fetch" content="world.json"> (build.sh: WEB_FETCH=world.json).
// This is how a shipped game gets its world without any browser storage. A file that is too big for
// the buffer, or that the tool refuses, is reported on the page.
async function loadFetched() {
  const meta = document.querySelector('meta[name="anvil-fetch"]');
  const exp = memory.exports;
  if (!meta || !exp || !exp.tool_has_files()) return;
  for (const name of meta.content.split(",").map(n => n.trim()).filter(n => n)) {
    let res;
    try { res = await fetch(name, { cache: "no-store" }); } catch (e) { say(`${name}: could not be fetched.`); continue; }
    if (!res.ok) { say(`${name}: not found next to the page.`); continue; }
    const data = new Uint8Array(await res.arrayBuffer());
    if (data.length > fileCapacity()) { say(`${name}: too large (${data.length} bytes, at most ${fileCapacity()}). Rebuild with WEB_FILE_MIB=<more>.`); continue; }
    bytesAt(exp.file_buffer(), data.length).set(data);
    say(exp.file_loaded(data.length) ? `Loaded ${name}.` : `${name}: not a valid file for this tool.`);
  }
}

// Closing or reloading the tab with unsaved edits asks the browser to confirm.
window.addEventListener("beforeunload", (ev) => {
  const exp = memory.exports;
  if (exp && exp.tool_is_dirty && exp.tool_is_dirty()) {
    ev.preventDefault();
    ev.returnValue = "";
  }
});

odin.runWasm("app.wasm", null, imports, memory)
  .then(() => {
    loadInputMap();
    loadGameTags();
    loadFetched();
    // The "open file" button follows the running tool: only tools with files can use it.
    setInterval(() => {
      document.getElementById("open-label").hidden = !memory.exports.tool_has_files();
    }, 250);
  })
  .catch(e => say("Failed to start: " + e));
</script>
</body>
</html>
